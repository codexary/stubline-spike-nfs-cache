services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    privileged: true
    volumes:
      - nfs_data:/data
    healthcheck:
      test: ["CMD-SHELL", "rpcinfo -p localhost | grep -q nfs"]
      interval: 2s
      timeout: 2s
      retries: 30
  client-a:
    build:
      context: .
      dockerfile: Dockerfile.client
    privileged: true
    volumes:
      - ./scripts:/opt/spike:ro
    depends_on:
      server:
        condition: service_healthy
  client-b:
    build:
      context: .
      dockerfile: Dockerfile.client
    privileged: true
    volumes:
      - ./scripts:/opt/spike:ro
    depends_on:
      server:
        condition: service_healthy
volumes:
  nfs_data:
